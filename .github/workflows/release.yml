name: Publish Android release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      APPLIFY_DISPATCH_TOKEN: ${{ secrets.APPLIFY_DISPATCH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" "ndk;28.2.13676358"

      - name: Validate release configuration and build
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Configure the existing Signal Atlas signing key}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Configure the Signal Atlas keystore password}"
          : "${ANDROID_KEY_ALIAS:?Configure the Signal Atlas key alias}"
          : "${ANDROID_KEY_PASSWORD:?Configure the Signal Atlas key password}"
          : "${APPLIFY_DISPATCH_TOKEN:?Configure a token with Contents: write on Applify}"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          [[ "$RELEASE_TAG" == "v$VERSION_NAME" && -n "$VERSION_CODE" ]]
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Sign, publish, and dispatch
        run: |
          set -euo pipefail
          VERSION_NAME="${RELEASE_TAG#v}"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          SDK_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          KEYSTORE="$RUNNER_TEMP/signal-atlas-release.jks"
          APK="$RUNNER_TEMP/Signal-Atlas-${VERSION_NAME}.apk"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          trap 'rm -f "$KEYSTORE"' EXIT
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          "$SDK_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$RUNNER_TEMP/aligned.apk"
          "$SDK_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$APK" "$RUNNER_TEMP/aligned.apk"
          "$SDK_TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apksigner.txt"
          [[ "$(grep -Ec '^Signer #[0-9]+:?[[:space:]]+certificate SHA-256 digest:' "$RUNNER_TEMP/apksigner.txt")" == "1" ]]
          BADGING="$("$SDK_TOOLS/aapt" dump badging "$APK")"
          grep -F "package: name='com.applify.signalatlas' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<< "$BADGING"
          CHECKSUM="$(sha256sum "$APK" | cut -d ' ' -f 1)"
          printf 'Signal Atlas %s\n\nSHA-256: %s\n' "$VERSION_NAME" "$CHECKSUM" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK" --title "Signal Atlas $VERSION_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          jq -n --arg version "$VERSION_NAME" --arg code "$VERSION_CODE" --arg tag "$RELEASE_TAG" --arg asset "Signal-Atlas-${VERSION_NAME}.apk" \
            '{event_type:"new_release",client_payload:{source_repo:"saurabhkundu1/signal-logger",package_name:"com.applify.signalatlas",version:$version,version_code:$code,tag:$tag,asset_name:$asset}}' > "$RUNNER_TEMP/dispatch.json"
          curl --fail --silent --show-error --request POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $APPLIFY_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/dispatch.json" \
            https://api.github.com/repos/saurabhkundu1/Applify/dispatches
